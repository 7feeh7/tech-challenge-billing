name: Deploy Application

# Ordem na main (fora de terraform/**): test → terraform apply → imagem (SHA) → deploy (manual após migration).
on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "docs/**"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: billing
  TF_ENVIRONMENT: producao
  TF_VERSION: 1.15.8
  TF_STATE_KEY: tech-challenge-billing/producao/terraform.tfstate
  OS_SERVICE_BASE_URL: http://oficina-api.oficina.svc.cluster.local

concurrency:
  group: billing-producao-pipeline
  cancel-in-progress: false

jobs:
  test:
    name: Build e Testes
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn prisma generate
      - run: yarn prisma migrate deploy
      - run: yarn lint
      - run: yarn build
      - run: yarn test:cov
      - run: yarn test:int
      - run: yarn test:e2e

      - name: Terraform fmt e validate
        uses: hashicorp/setup-terraform@v3
      - name: Terraform validate (sem backend)
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Verificar ausência de resíduos de prova em src
        run: |
          if git grep -n -E "prova_simular_falha|MP_WEBHOOK_PROVA_HABILITADA|webhook-entregas|gerarAssinaturaParaProva|prova-tecnica" -- src; then
            echo "Código de prova técnica encontrado em src/"
            exit 1
          fi

      - name: Docker build e inspeção
        run: |
          docker build -t billing-ci:local .
          docker run --rm billing-ci:local sh -c '! test -f .env && ! test -d prova-tecnica'

  terraform:
    name: Terraform do serviço
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan -no-color \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  deploy:
    name: Deploy no EKS
    if: github.ref == 'refs/heads/main'
    needs: [test, terraform]
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolver parametros via SSM
        id: ssm
        run: |
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          ECR=$(aws ssm get-parameter --name "${PREFIX}/infra/billing_ecr_repository_url" --query Parameter.Value --output text)
          EKS=$(aws ssm get-parameter --name "${PREFIX}/infra/eks_cluster_name" --query Parameter.Value --output text)
          IRSA=$(aws ssm get-parameter --name "${PREFIX}/infra/billing_irsa_role_arn" --query Parameter.Value --output text)
          API_GATEWAY_URL=$(aws ssm get-parameter --name "${PREFIX}/infra/api_gateway_url" --query Parameter.Value --output text)
          BILLING_IN=$(aws ssm get-parameter --name "${PREFIX}/infra/billing_in_queue_url" --query Parameter.Value --output text)
          OS_IN=$(aws ssm get-parameter --name "${PREFIX}/infra/os_in_queue_url" --query Parameter.Value --output text)
          BILLING_DB_ARN=$(aws ssm get-parameter --name "${PREFIX}/database/billing_db_secret_arn" --query Parameter.Value --output text)
          JWT_PUBLIC_ARN=$(aws ssm get-parameter --name "${PREFIX}/infra/jwt_public_secret_arn" --query Parameter.Value --output text)
          TOKEN_BILLING_OS_ARN=$(aws ssm get-parameter --name "${PREFIX}/infra/token_billing_os_secret_arn" --query Parameter.Value --output text)
          MP_ARN=$(aws ssm get-parameter --name "${PREFIX}/infra/mercado_pago_secret_arn" --query Parameter.Value --output text)
          echo "ecr=$ECR" >> $GITHUB_OUTPUT
          echo "eks=$EKS" >> $GITHUB_OUTPUT
          echo "irsa=$IRSA" >> $GITHUB_OUTPUT
          echo "api_gateway_url=$API_GATEWAY_URL" >> $GITHUB_OUTPUT
          echo "billing_in=$BILLING_IN" >> $GITHUB_OUTPUT
          echo "os_in=$OS_IN" >> $GITHUB_OUTPUT
          echo "billing_db_arn=$BILLING_DB_ARN" >> $GITHUB_OUTPUT
          echo "jwt_public_arn=$JWT_PUBLIC_ARN" >> $GITHUB_OUTPUT
          echo "token_billing_os_arn=$TOKEN_BILLING_OS_ARN" >> $GITHUB_OUTPUT
          echo "mp_arn=$MP_ARN" >> $GITHUB_OUTPUT

      - name: Montar DATABASE_URL do Billing
        id: db
        run: |
          SECRET=$(aws secretsmanager get-secret-value --secret-id "${{ steps.ssm.outputs.billing_db_arn }}" --query SecretString --output text)
          USER=$(echo "$SECRET" | jq -r .username)
          PASS=$(echo "$SECRET" | jq -r .password)
          HOST=$(echo "$SECRET" | jq -r .host)
          PORT=$(echo "$SECRET" | jq -r .port)
          DB=$(echo "$SECRET" | jq -r .dbname)
          URL="postgresql://${USER}:${PASS}@${HOST}:${PORT}/${DB}?schema=public"
          echo "::add-mask::$URL"
          echo "database_url=$URL" >> $GITHUB_OUTPUT

      - name: Obter segredos da aplicação
        id: secrets
        env:
          JWT_PUBLIC_ARN: ${{ steps.ssm.outputs.jwt_public_arn }}
          TOKEN_BILLING_OS_ARN: ${{ steps.ssm.outputs.token_billing_os_arn }}
          MP_ARN: ${{ steps.ssm.outputs.mp_arn }}
        run: |
          JWT_JSON=$(aws secretsmanager get-secret-value --secret-id "$JWT_PUBLIC_ARN" --query SecretString --output text)
          JWT=$(echo "$JWT_JSON" | jq -r 'if .publicKey then .publicKey elif .public_key then .public_key else . end')
          TOKEN_OS=$(aws secretsmanager get-secret-value --secret-id "$TOKEN_BILLING_OS_ARN" --query SecretString --output text | jq -r 'if .token then .token else . end')
          MP=$(aws secretsmanager get-secret-value --secret-id "$MP_ARN" --query SecretString --output text)
          MP_ACCESS=$(echo "$MP" | jq -r .MP_ACCESS_TOKEN)
          MP_WEBHOOK=$(echo "$MP" | jq -r .MP_WEBHOOK_SECRET)
          echo "jwt_public<<EOF" >> $GITHUB_OUTPUT
          echo "$JWT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "::add-mask::$TOKEN_OS"
          echo "::add-mask::$MP_ACCESS"
          echo "::add-mask::$MP_WEBHOOK"
          echo "os_token=$TOKEN_OS" >> $GITHUB_OUTPUT
          echo "mp_access=$MP_ACCESS" >> $GITHUB_OUTPUT
          echo "mp_webhook=$MP_WEBHOOK" >> $GITHUB_OUTPUT

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push imagem (SHA imutavel)
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ steps.ssm.outputs.ecr }}
        run: |
          docker build -t "$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ steps.ssm.outputs.eks }}"

      - name: ServiceAccount, ConfigMap e Secret
        env:
          IRSA_ARN: ${{ steps.ssm.outputs.irsa }}
          API_GATEWAY_URL: ${{ steps.ssm.outputs.api_gateway_url }}
          SQS_BILLING_IN_URL: ${{ steps.ssm.outputs.billing_in }}
          SQS_OS_IN_URL: ${{ steps.ssm.outputs.os_in }}
        run: |
          sed "s|BILLING_IRSA_ROLE_ARN|${IRSA_ARN}|g" k8s/serviceaccount.yaml | kubectl apply -f -
          sed -e "s|__API_GATEWAY_URL__|${API_GATEWAY_URL}|g" \
              -e "s|__SQS_BILLING_IN_URL__|${SQS_BILLING_IN_URL}|g" \
              -e "s|__SQS_OS_IN_URL__|${SQS_OS_IN_URL}|g" \
              -e "s|__OS_SERVICE_BASE_URL__|${OS_SERVICE_BASE_URL}|g" \
              k8s/configmap.yaml | kubectl apply -f -
          kubectl create secret generic billing-secret \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=DATABASE_URL='${{ steps.db.outputs.database_url }}' \
            --from-literal=JWT_PUBLIC_KEY='${{ steps.secrets.outputs.jwt_public }}' \
            --from-literal=OS_SERVICE_TOKEN='${{ steps.secrets.outputs.os_token }}' \
            --from-literal=MP_ACCESS_TOKEN='${{ steps.secrets.outputs.mp_access }}' \
            --from-literal=MP_WEBHOOK_SECRET='${{ steps.secrets.outputs.mp_webhook }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deployment, Service e HPA
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ steps.ssm.outputs.ecr }}
        run: |
          sed -e "s|ECR_REPOSITORY_URL:__IMAGE_TAG__|${ECR_REPOSITORY}:${IMAGE_TAG}|g" \
              -e "s|__IMAGE_TAG__|${IMAGE_TAG}|g" \
              k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/billing-api \
            --namespace "$K8S_NAMESPACE" --timeout=180s

      - name: Smoke test — health readiness
        run: |
          kubectl run smoke-billing-${{ github.run_id }} \
            --namespace "$K8S_NAMESPACE" \
            --image=curlimages/curl:8.5.0 \
            --restart=Never \
            --command -- sleep 300
          kubectl wait --for=condition=Ready pod/smoke-billing-${{ github.run_id }} \
            --namespace "$K8S_NAMESPACE" --timeout=60s
          kubectl exec smoke-billing-${{ github.run_id }} -n "$K8S_NAMESPACE" -- \
            curl -sf "http://billing-api/health/ready"
          kubectl delete pod smoke-billing-${{ github.run_id }} -n "$K8S_NAMESPACE"
