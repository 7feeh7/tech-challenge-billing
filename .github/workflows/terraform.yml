name: Terraform Billing

# apply/destroy da pasta terraform/ — somente main + environment producao.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: Ação Terraform
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
      confirm_destroy:
        description: Digite DESTRUIR-tech-challenge-billing para confirmar destroy
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.15.8
  TF_ENVIRONMENT: producao
  TF_STATE_KEY: tech-challenge-billing/producao/terraform.tfstate

concurrency:
  group: billing-producao-pipeline
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validar confirmação de destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTRUIR-tech-challenge-billing" ]; then
            echo "Confirmação de destroy inválida ou ausente."
            echo "Digite exatamente: DESTRUIR-tech-challenge-billing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform Plan
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.action == 'plan' ||
          github.event.inputs.action == 'apply'
        working-directory: terraform
        run: |
          terraform plan -no-color \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        working-directory: terraform
        run: |
          terraform destroy -auto-approve \
            -var="environment=${{ env.TF_ENVIRONMENT }}"

      - name: Smoke — exports SSM do Billing
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: |
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          aws ssm get-parameter --name "${PREFIX}/infra/billing_ecr_repository_url"
          aws ssm get-parameter --name "${PREFIX}/infra/billing_in_queue_url"
          aws ssm get-parameter --name "${PREFIX}/infra/mercado_pago_secret_arn"
