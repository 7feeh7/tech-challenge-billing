apiVersion: v1
kind: Service
metadata:
  name: billing-api
  namespace: billing
  labels:
    app: billing-api
spec:
  # NodePort fixo: o target group `tech-challenge-producao-bill-tg` (listener 8081 do
  # NLB interno) aponta para 30081; sem ele o health check falha. O tráfego público
  # entra só pelo API Gateway. O ClusterIP (port 80) segue valendo para as chamadas internas.
  type: NodePort
  selector:
    app: billing-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
      protocol: TCP
