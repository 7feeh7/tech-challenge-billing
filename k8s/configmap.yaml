apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: billing
  labels:
    app: billing-api
data:
  PORT: "3000"
  NODE_ENV: "production"
  DATABASE_SSL: "true"
  DATABASE_POOL_MAX: "5"
  DATABASE_POOL_CONNECTION_TIMEOUT_MS: "10000"
  AWS_REGION: "us-east-1"
  API_GATEWAY_URL: "__API_GATEWAY_URL__"
  SQS_BILLING_IN_URL: "__SQS_BILLING_IN_URL__"
  DD_SITE: "datadoghq.com"
