apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: billing
  labels:
    app: billing-api
data:
  PORT: "3000"
  NODE_ENV: "production"
  DATABASE_SSL: "true"
  DATABASE_POOL_MAX: "5"
  DATABASE_POOL_CONNECTION_TIMEOUT_MS: "10000"
  AWS_REGION: "us-east-1"
  API_GATEWAY_URL: "__API_GATEWAY_URL__"
  SQS_BILLING_IN_URL: "__SQS_BILLING_IN_URL__"
  SQS_OS_IN_URL: "__SQS_OS_IN_URL__"
  OS_SERVICE_BASE_URL: "__OS_SERVICE_BASE_URL__"
  OS_REQUEST_TIMEOUT_MS: "3000"
  OS_REQUEST_MAX_TENTATIVAS: "3"
  PRAZO_CARENCIA_MINUTOS: "15"
  JWT_ISSUER: "tech-challenge-auth"
  JWT_AUDIENCE: "tech-challenge-api"
  SQS_CONSUMER_HABILITADO: "true"
  SQS_CONSUMER_INTERVAL_MS: "1000"
  OUTBOX_PUBLISHER_HABILITADO: "true"
  OUTBOX_PUBLISHER_INTERVAL_MS: "2000"
  OUTBOX_REIVINDICACAO_MS: "350000"
  APROVACAO_PROCESSADOR_HABILITADO: "true"
  APROVACAO_PROCESSADOR_INTERVAL_MS: "10000"
  APROVACAO_REIVINDICACAO_MS: "150000"
  COBRANCA_CRIACAO_PROCESSADOR_HABILITADO: "true"
  COBRANCA_CRIACAO_PROCESSADOR_INTERVAL_MS: "10000"
  COBRANCA_CRIACAO_PROCESSADOR_LOTE: "5"
  COBRANCA_CONCILIACAO_PROCESSADOR_HABILITADO: "true"
  COBRANCA_CONCILIACAO_PROCESSADOR_INTERVAL_MS: "10000"
  COBRANCA_CONCILIACAO_PROCESSADOR_LOTE: "10"
  COBRANCA_EXPIRACAO_PROCESSADOR_HABILITADO: "true"
  COBRANCA_EXPIRACAO_PROCESSADOR_INTERVAL_MS: "10000"
  COBRANCA_EXPIRACAO_PROCESSADOR_LOTE: "10"
  COBRANCA_REIVINDICACAO_MS: "950000"
  MP_API_BASE_URL: "https://api.mercadopago.com"
  MP_REQUEST_TIMEOUT_MS: "30000"
  MP_PAYER_EMAIL: "comprador@example.com"
  CANCELAMENTO_FINANCEIRO_PROCESSADOR_HABILITADO: "true"
  CANCELAMENTO_FINANCEIRO_PROCESSADOR_INTERVAL_MS: "10000"
  CANCELAMENTO_FINANCEIRO_PROCESSADOR_LOTE: "5"
  CANCELAMENTO_FINANCEIRO_REIVINDICACAO_MS: "775000"
  CANCELAMENTO_FINANCEIRO_AGUARDAR_MS: "15000"
  CANCELAMENTO_FINANCEIRO_MAX_TENTATIVAS_MP: "5"
  CANCELAMENTO_FINANCEIRO_RETRY_MP_MS: "30000"
  DD_SITE: "datadoghq.com"
